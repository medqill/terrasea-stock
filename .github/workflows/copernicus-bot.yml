# Workflow Pengunduh Data Copernicus Otomatis (Mode Online Cloud)
# Berjalan otomatis setiap 12 jam atau via tombol manual (workflow_dispatch)
name: Copernicus Ocean Ingest Bot

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Tanggal awal (YYYY-MM-DD), kosongkan untuk auto-incremental"
        required: false
        default: ""

concurrency:
  group: copernicus-ingest
  cancel-in-progress: false

jobs:
  download-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependensi Bot
        run: |
          python -m pip install --upgrade pip
          pip install copernicusmarine requests python-dotenv pandas xarray netcdf4

      - name: Jalankan Bot Copernicus
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            python bot/copernicus_bot.py --mode once --start-date "${{ github.event.inputs.start_date }}"
          else
            python bot/copernicus_bot.py --mode once
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependensi Node
        run: npm ci

      - name: Install Dependensi ML Pipeline
        run: |
          pip install joblib pyyaml scikit-learn shapely openpyxl

      - name: Jalankan Pipeline ML Dinamis (IDW Grids & Stock Forecast)
        run: |
          python ml/pipeline_rf.py

      - name: Validasi Kontrak Data Olahan
        run: |
          npm run validate

      - name: Publikasi Artefak ke Backend (Database Turso)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          npm run publish-artifacts

      - name: Commit & Push Cadangan Data & Artefak Terbaru
        run: |
          git config --global user.name "copernicus-bot[bot]"
          git config --global user.email "copernicus-bot@users.noreply.github.com"
          git add data/ingest_backup/copernicus_ocean.csv data/processed/
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data baru untuk di-commit."
          else
            git commit -m "Auto: Update observasi oseanografi & hasil olahan ML dinamis"
            git pull --rebase origin main
            git push
          fi

