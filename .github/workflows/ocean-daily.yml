# Prakiraan oseanografi harian (LSTM) + grid IDW H-3..H+3. Terpisah dari workflow bulanan PLS/zona.
# Jadwal: setiap hari 05:00 WIB (22:00 UTC) dan manual.
name: Ocean Daily Pipeline

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: ocean-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Periksa kesiapan skrip ML
        id: ready
        run: |
          if [ -f ml/05a_ocean_forecast.py ] && [ -f ml/05b_grids_idw.py ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ml/05a_ocean_forecast.py atau ml/05b_grids_idw.py belum ada; workflow dilewati."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 22
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependensi Node
        if: steps.ready.outputs.ready == 'true'
        run: npm ci

      - name: Setup Python 3.11
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependensi Python
        if: steps.ready.outputs.ready == 'true'
        run: pip install -r ml/requirements.txt

      - name: Ekspor observasi mentah dari Turso ke data/raw/
        if: steps.ready.outputs.ready == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run export-observations

      - name: Prakiraan harian LSTM
        if: steps.ready.outputs.ready == 'true'
        run: python ml/05a_ocean_forecast.py

      - name: Grid IDW 7 hari dan ocean_window
        if: steps.ready.outputs.ready == 'true'
        run: python ml/05b_grids_idw.py

      - name: Validasi kontrak data olahan
        if: steps.ready.outputs.ready == 'true'
        run: npm run validate

      - name: Publikasi ke tabel artifacts (termasuk pembersihan dgrid > 14 hari)
        if: steps.ready.outputs.ready == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run publish-artifacts